<ion-header>
  <ion-toolbar color="danger">
    <ion-title>Pokédex</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="abrirFormulario()">Agregar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-grid>
    <ion-row>
      <ion-col size="12" size-sm="6" size-md="4" size-lg="3" *ngFor="let p of pokemons()">
        <ion-card>
          <img [src]="p.imagen_url" [alt]="p.nombre" />
          <ion-card-header>
            <ion-card-subtitle>#{{ p.numero_pokedex }}</ion-card-subtitle>
            <ion-card-title class="ion-text-capitalize">{{ p.nombre }}</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <p>Tipos: {{ p.tipos.join(', ') }}</p>
            <p>Precio: {{ p.precio | currency }}</p>
            <p>Stock: {{ p.stock }}</p>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
