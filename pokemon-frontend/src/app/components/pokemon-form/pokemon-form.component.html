<ion-header>
    <ion-toolbar>
    <ion-buttons slot="start">
        <ion-button (click)="cancelar()">Cancelar</ion-button>
    </ion-buttons>
    <ion-title>Nuevo Pokémon</ion-title>
    <ion-buttons slot="end">
        <ion-button strong (click)="guardar()">Guardar</ion-button>
    </ion-buttons>
    </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
    <form [formGroup]="form">
    <ion-list>
        <ion-item>
        <ion-input label="N° Pokédex" labelPlacement="floating" type="number"
            formControlName="numero_pokedex" errorText="Requerido, mínimo 1"></ion-input>
        </ion-item>
        <ion-item>
        <ion-input label="Nombre" labelPlacement="floating"
            formControlName="nombre" errorText="Mínimo 3 caracteres"></ion-input>
        </ion-item>
        <ion-item>
        <ion-input label="URL de imagen" labelPlacement="floating"
            formControlName="imagen_url" errorText="Requerido"></ion-input>
        </ion-item>
        <ion-item>
        <ion-input label="Tipos (separados por coma)" labelPlacement="floating"
            formControlName="tipos" errorText="Requerido"></ion-input>
        </ion-item>
        <ion-item>
        <ion-input label="Precio" labelPlacement="floating" type="number"
            formControlName="precio" errorText="Debe ser 0 o más"></ion-input>
        </ion-item>
        <ion-item>
        <ion-input label="Stock" labelPlacement="floating" type="number"
            formControlName="stock" errorText="Debe ser 0 o más"></ion-input>
        </ion-item>
    </ion-list>
    </form>
</ion-content>
